appId: ai.lapidare.app
productName: Lapidare
executableName: lapidare
artifactName: "${productName}-${version}-${arch}.${ext}"
directories:
  output: dist
  buildResources: build-resources
files:
  - "*.cjs"
  - package.json
  - build-resources/icon.png
extraResources:
  - from: build/python
    to: python
  - from: build/web
    to: web
  # O AppImage le o icone daqui para se integrar ao menu de apps na primeira execucao.
  - from: build-resources/icon.png
    to: icon.png
asar: true
electronFuses:
  runAsNode: false
  enableNodeCliInspectArguments: false
  enableNodeOptionsEnvironmentVariable: false
  onlyLoadAppFromAsar: true
# AppImage novo (runtime estatico, sem libfuse2): o legado exige libfuse.so.2, ausente em distros recentes.
toolsets:
  appimage: "1.0.3"
linux:
  target:
    - target: AppImage
      arch: x64
    - target: deb
      arch: x64
    - target: rpm
      arch: x64
  category: Education
  icon: icon.png
  syncDesktopName: true
  maintainer: Lazaro Enrico <lazaroenrico@gmail.com>
  vendor: Lazaro Enrico
  synopsis: Learning harness local-first
  desktop:
    entry:
      StartupWMClass: lapidare
      Comment: Estude com um tutor que mede, planeja e ensina
deb:
  packageName: lapidare
rpm:
  packageName: lapidare
# .dmg sem assinatura nem notarizacao (o Gatekeeper avisa na primeira abertura); sem auto-update no Mac.
mac:
  artifactName: "${productName}-${version}-mac-${arch}.${ext}"
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.education
  icon: icon-1024.png
  identity: null
  hardenedRuntime: false
  extendInfo:
    NSMicrophoneUsageDescription: O Lapidare usa o microfone apenas para o ditado por voz.
  gatekeeperAssess: false
dmg:
  sign: false
publish:
  provider: github
  owner: Lazaroenrico
  repo: lapidare
  releaseType: draft
