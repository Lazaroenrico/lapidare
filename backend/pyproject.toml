[project]
name = "learnharness"
version = "0.1.1"
description = "Local-first, Vault-backed Learning Harness for the Google Ecosystem"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<1",
    "uvicorn[standard]>=0.32.0,<1",
    "pydantic>=2.10.0,<3",
    "fastmcp>=4.1,<5",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "aiosqlite>=0.20.0,<1",
    "google-genai>=2.0,<3",
    "watchfiles>=1.0.0,<2",
    "pyyaml>=6.0.2,<7",
    "lzstring>=1.0.4",
    "python-multipart>=0.0.12,<1",
    "mcp>=2.3,<3",
    "pypdf>=6.21.2",
    "pypdfium2>=5.14.0",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
    "pytest-timeout>=2.3,<3",
    "basedpyright>=1.31,<2",
    "types-pyyaml>=6,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/learnharness"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "BLE", "S110", "S112", "UP", "RUF", "SIM"]
# Line length is enforced by review, not lint, until a formatter pass lands.
# RUF001: Portuguese prose and math symbols in strings are intentional.
ignore = ["E501", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["BLE001", "S110", "S112", "B017"]

[tool.basedpyright]
include = ["src"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
# "standard" everywhere; core/ (pure types and functions) is held to strict.
typeCheckingMode = "standard"
strict = ["src/learnharness/core"]
reportMissingTypeStubs = false
